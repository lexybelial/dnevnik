<style>
  :root{ --bg:#1F2637; --card:#2A3347; --card2:#343E55; --line:#3E4961; --text:#F2ECE3; --sub:#9DA8BF; --accent:#D9A97A; --danger:#E07A6A; --blue:#4F6180; --purple:#6C7A9C; --green:#7FC5A0; --monthbg:#3F5070; --monthtx:#F2ECE3; --weekbg:#2C3649; --weektx:#C6D0E3; --weekcur:#4F6180; --cornerbg:#4F6180; --onAccent:#1F2637; --hover:rgba(255,255,255,.05); --shadow:none; }

  .miniBtn{ background:var(--card2); border:1px dashed var(--line); color:var(--accent); border-radius:12px; padding:12px; font-size:14px; cursor:pointer; width:100%; display:flex; align-items:center; justify-content:center; gap:8px; }
  .smBtn{ background:var(--card2); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:6px 10px; font-size:12.5px; cursor:pointer; white-space:nowrap; display:inline-flex; align-items:center; gap:5px; }

  .smBtn.acc{ color:var(--accent); border-color:var(--accent); }
  .smBtn.dng{ color:var(--danger); }
  .item{ display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }

  .itemSub{ font-size:12px; color:var(--sub); margin-top:3px; }

  .pager{ display:flex; align-items:center; gap:10px; padding:2px 16px 10px; flex-shrink:0; }
  .pagerBtn{ background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:9px 12px; cursor:pointer; display:flex; }

  .tabsTop{ display:flex; gap:6px; padding:0 12px 10px; flex-shrink:0; }

  .mLabel{ display:block; font-size:13px; font-weight:600; color:var(--sub); margin:14px 0 7px; }
  .mActions{ display:flex; gap:10px; align-items:center; margin-top:18px; }

  .dotBtn:hover{ border-color:var(--sub); }
  .busy{ position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:99; display:flex; align-items:center; justify-content:center; color:#fff; font-size:16px; }
  .scrollbar-thin{ scrollbar-width:thin; }

  html[data-theme="light"] .pcard,html[data-theme="light"] .sheet,html[data-theme="light"] .cmt,html[data-theme="light"] .banner{ box-shadow:var(--shadow); border-color:transparent; }
  html[data-theme="light"] .banner{ border-color:var(--accent); }
  html[data-theme="light"] .tbtn,html[data-theme="light"] .tabTop,html[data-theme="light"] .yearNav,html[data-theme="light"] .smBtn,html[data-theme="light"] .chip{ background:#fff; }
  html[data-theme="light"] .tabTop.on{ background:var(--accent); }
  html[data-theme="light"] .plan .projTd{ background:#fff; }
  html[data-theme="light"] .miniChk{ background:#fff; }
  .miniChk.on svg,.cbox.on svg{ stroke:var(--onAccent); }
  @media (display-mode: standalone),(display-mode: fullscreen){ .app{ padding-top:env(safe-area-inset-top); } }

  /* ---------- планшет / десктоп ---------- */
  @media (min-width:768px){
    .app{ max-width:860px; }
    .overlay{ align-items:center; }
    .sheet{ border-radius:20px; max-width:600px; max-height:86vh; padding-bottom:22px; box-shadow:0 20px 60px rgba(0,0,0,.45); }
    .fab{ display:none; }
    .tabsTop{ max-width:520px; }
  }
  @media (min-width:1024px){ .app{ max-width:1060px; } }
  @media (min-width:1200px){
    .app{ max-width:none; padding:0 24px; }
    .app.tableApp{ padding:0 12px; }
    .topbar{ padding:14px 8px 10px; }
    .title{ font-size:22px; }
    .plan .corner,.plan .projTd,.addProjBtn{ width:230px; min-width:230px; max-width:230px; }
    .plan .projTd{ font-size:14px; padding:12px; }
    .plan .weekTh,.plan .cell{ min-width:176px; width:176px; max-width:176px; }
    .plan .cell{ padding:8px; font-size:13px; }
    .cellTaskT{ font-size:13px; }
    .plan .weekTh{ font-size:12px; }
    .narrow{ max-width:760px; }
    .sheet{ max-width:640px; }
    .tableWrap{ padding-bottom:20px; }
  }
</style>
</head>

function askDeleteProject(p){ askConfirm("Удалить проект?","«"+p.name+"», его дневник и все ячейки в таблице будут удалены.",function(){

      askConfirm("Импортировать бэкап?","Проектов: "+n+", ячеек: "+nc+". Текущие данные будут заменены.",function(){ importBackup(obj); },"Импортировать"); }catch(e){ alert("Файл не похож на бэкап Планера: "+e.message); } }; r.readAsText(f); });

  state.images=obj.images||{}; Object.keys(state.images).forEach(function(id){ idbSet(id,state.images[id]).catch(function(){}); });
  normalize(); saveAll(); state.busy=null; state.modal=null; state.view="table"; state.scrollToCur=true; render(); },50); }

/* выгрузка для ИИ */
var AI_PROMPT="Ты — мой помощник по планированию. Ниже выгрузка из моего планера недель: проекты, задачи по неделям, переносы, паузы, входящие, идеи и комментарии. Посмотри на неё и помоги: 1) какие задачи переносятся из недели в неделю и почему это может происходить; 2) что стоит поставить на паузу или убрать; 3) что реально сделать на следующей неделе; 4) где я перегружена, а где недогружена. Пиши просто и по делу.";
function aiRange(){ var t=today0(); var g=state.ai.gran; if(g==="week"){ var w=currentWeek(); return [w.start,w.end]; }
  if(g==="month"){ return [new Date(t.getFullYear(),t.getMonth(),1), new Date(t.getFullYear(),t.getMonth()+1,0,23,59,59)]; }
  var a=parseDate(state.ai.from)||new Date(t.getTime()-6*864e5), b=parseDate(state.ai.to)||t; b.setHours(23,59,59,0); return [a,b]; }
function buildAiExport(){ var r=aiRange(), a=r[0], b=r[1]; var lines=[];
  lines.push("ПЛАНЕР НЕДЕЛЬ — выгрузка за "+fmtD(a)+" – "+fmtD(b)+" "+b.getFullYear()+" (сегодня "+fmtD(today0())+")"); lines.push("");
  var weeks=[]; var mon=mondayOf(a); while(mon<=b){ weeks.push(mkWeek(mon)); mon=new Date(mon); mon.setDate(mon.getDate()+7); }
  var tot={done:0,undone:0,moved:0};
  state.projects.forEach(function(p){ if(p.status==="done")return;
    lines.push("=== "+p.name+(p.fullName?" — "+p.fullName:"")+" ["+STATUS_META[p.status].label+(p.category?", "+p.category:"")+(p.start?", старт "+p.start:"")+(p.deadline?", дедлайн "+p.deadline:"")+"]");
    if(p.doc.description.trim())lines.push("Описание: "+p.doc.description.trim());
    weeks.forEach(function(w){ var c=getCell(p.id,w.key); if(!c||!c.tasks.length)return; lines.push("Неделя "+weekLabel(w)+":");
      c.tasks.forEach(function(t){ var mark=t.movedTo?(t.movedTo==="pause"?"⏸ на паузу":"↪ перенесена")+": ":(t.done?"✅ ":"❌ "); var extra=[]; if(t.label)extra.push(LABELS[t.label].label); if(t.moves)extra.push("переносов: "+t.moves);
        if(!t.movedTo){ if(t.done)tot.done++; else tot.undone++; } if(t.movedTo&&t.movedTo!=="pause")tot.moved++;
        lines.push("  "+mark+t.text+(extra.length?" ("+extra.join(", ")+")":"")); }); });
    if(p.inbox.length){ lines.push("Входящие (не поставлены в неделю):"); p.inbox.forEach(function(t){ lines.push("  • "+t.text+(t.label?" ("+LABELS[t.label].label+")":"")); }); }
    if(p.paused.length){ lines.push("На паузе:"); p.paused.forEach(function(t){ lines.push("  ⏸ "+t.text+(t.moves?" (переносов: "+t.moves+")":"")); }); }
    if(p.ideas.length){ lines.push("Идеи:"); p.ideas.forEach(function(t){ lines.push("  💡 "+t.text); }); }
    var cms=p.doc.comments.filter(function(c){ var d=new Date(c.date); return d>=a&&d<=b; }).sort(function(x,y){return new Date(x.date)-new Date(y.date);});
    if(cms.length){ lines.push("Комментарии:"); cms.forEach(function(c){ lines.push("  "+fmtD(new Date(c.date))+(c.task?" [к задаче: "+c.task+"]":"")+": "+c.text.replace(/\n/g," ")); }); }
    lines.push(""); });
  lines.push("ИТОГО за период: сделано "+tot.done+", не сделано "+tot.undone+", перенесено "+tot.moved+".");
  var text=lines.join("\n"); if(state.ai.prompt)text=AI_PROMPT+"\n\n"+text; return text; }
function AiModal(){ var body=h("div",null); var a=state.ai;
  var seg=h("div",{class:"lblPick"}); [["week","Эта неделя"],["month","Этот месяц"],["range","Период"]].forEach(function(g){ seg.appendChild(h("button",{class:a.gran===g[0]?"on":"",style:a.gran===g[0]?{background:"var(--accent)",color:"var(--onAccent)"}:{}, onClick:function(){ a.gran=g[0]; render(); }}, g[1])); }); body.appendChild(seg);
  if(a.gran==="range"){ var t=today0(); var fi=h("input",{class:"inp",type:"date"}); fi.value=a.from||isoDate(new Date(t.getTime()-6*864e5)); fi.addEventListener("input",function(){ a.from=fi.value; render(); });
    var ti=h("input",{class:"inp",type:"date"}); ti.value=a.to||isoDate(t); ti.addEventListener("input",function(){ a.to=ti.value; render(); });
    body.appendChild(h("div",{class:"row",style:{marginTop:"10px"}}, fi, h("span",{style:{color:"var(--sub)"}},"—"), ti)); }
  body.appendChild(h("div",{class:"chk",style:{marginTop:"10px",borderBottom:"none",cursor:"pointer"}, onClick:function(){ a.prompt=!a.prompt; render(); }}, h("span",{class:"cbox"+(a.prompt?" on":""),style:{width:"22px",height:"22px"}}, a.prompt?icon("check",14,"var(--onAccent)",3):null), h("span",{style:{fontSize:"14px"}},"Добавить промпт для ИИ-разбора")));
  var text=buildAiExport(); var pre=h("div",{class:"pre"}, text); body.appendChild(pre);
  var st=h("span",{style:{fontSize:"13px",color:"var(--sub)"}}, text.length+" символов");
  var act=h("div",{class:"mActions"}); act.appendChild(st); act.appendChild(h("div",{style:{flex:"1"}})); act.appendChild(h("button",{class:"ghostBtn", onClick:closeModal},"Закрыть"));
  act.appendChild(h("button",{class:"primaryBtn", onClick:function(){ copyText(text,function(ok){ st.textContent=ok?"Скопировано ✓":"Не удалось — выдели текст вручную"; }); }}, "Скопировать")); body.appendChild(act);
  return modalShell("Выгрузка для ИИ", body); }
function copyText(text,cb){ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(function(){cb(true);},function(){ cb(fallbackCopy(text)); }); } else cb(fallbackCopy(text)); }
function fallbackCopy(text){ try{ var ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); var ok=document.execCommand("copy"); ta.remove(); return ok; }catch(e){ return false; } }

/* ---------- общие ---------- */
function closeModal(){ state.modal=null; state.draft=null; render(); }
function askConfirm(title,text,onYes,yesLabel){ state.confirm={title:title,text:text,onYes:onYes,yes:yesLabel||"Удалить",prev:{modal:state.modal,draft:state.draft}}; state.modal="confirm"; render(); }
function ConfirmModal(){ var c=state.confirm; var cancel=function(){ var pv=c.prev; state.confirm=null; state.modal=pv.modal==="confirm"?null:pv.modal; state.draft=pv.draft; render(); };
  var overlay=h("div",{class:"overlay", onClick:cancel});

  var act=h("div",{class:"mActions"}); act.appendChild(h("div",{style:{flex:"1"}})); act.appendChild(h("button",{class:"ghostBtn", onClick:cancel},"Отмена"));

function openImage(id,onDelete){ state.draft={imgId:id,onDelete:onDelete}; state.modal="image"; render(); }
function ImageModal(){ var d=state.draft; var overlay=h("div",{class:"overlay",style:{alignItems:"center"}, onClick:closeModal});
  var box=h("div",{style:{maxWidth:"92%",maxHeight:"88vh"}, onClick:function(e){e.stopPropagation();}});

function modalShell(title,body){ var overlay=h("div",{class:"overlay", onClick:closeModal}); var sheet=h("div",{class:"sheet", onClick:function(e){e.stopPropagation();}});
  sheet.appendChild(h("div",{class:"sheetHead"}, h("span",{style:{fontWeight:"600",fontSize:"16px"}}, title), h("button",{class:"iconBtn", onClick:closeModal}, icon("x",22,"var(--sub)")))); sheet.appendChild(body); overlay.appendChild(sheet); return overlay; }
function photoButton(label,cb){ var wrap=h("div",null); var input=h("input",{type:"file",accept:"image/*",style:{display:"none"}});
  var btn=h("button",{class:"miniBtn", onClick:function(){ input.click(); }}, icon("image",16,"var(--accent)"), h("span",null,label));
  input.addEventListener("change",function(){ var f=input.files&&input.files[0]; input.value=""; if(!f)return; btn.querySelector("span").textContent="Загрузка…"; addImage(f).then(function(id){ cb(id); }).catch(function(){ btn.querySelector("span").textContent=label; }); });
  wrap.appendChild(btn); wrap.appendChild(input); return wrap; }
document.addEventListener("keydown",function(e){ if(e.key==="Escape"&&state.modal){ if(state.modal==="confirm"){ var pv=state.confirm.prev; state.confirm=null; state.modal=pv.modal==="confirm"?null:pv.modal; state.draft=pv.draft; render(); } else closeModal(); } });

/* ---------- нормализация и миграция ---------- */
function normalize(){ state.projects.forEach(function(p){ if(!p.status)p.status="active"; if(p.category==null)p.category=""; if(p.deadline===undefined)p.deadline=null; if(p.start===undefined)p.start=null; if(p.fullName==null)p.fullName="";
    if(!p.doc)p.doc={description:"",comments:[],checklist:[]}; ["comments","checklist"].forEach(function(k){ if(!p.doc[k])p.doc[k]=[]; }); if(p.doc.description==null)p.doc.description="";
    if(p.doc.images&&p.doc.images.length){ p.doc.comments.push({id:uid(),text:"Картинки проекта",date:new Date().toISOString(),images:p.doc.images}); } delete p.doc.images;
    p.doc.comments.forEach(function(c){ if(!c.images)c.images=[]; });
    ["inbox","paused","ideas"].forEach(function(k){ if(!Array.isArray(p[k]))p[k]=[]; }); });
  Object.keys(state.cells).forEach(function(k){ var c=state.cells[k]; if(!c){ delete state.cells[k]; return; } if(!c.tasks)c.tasks=[]; c.tasks=c.tasks.map(cleanTask).filter(function(t){return t.text;}); if(!c.color)c.color="none"; }); }
function migrateV2(){ var oldP=null; try{ oldP=JSON.parse(localStorage.getItem("plan-projects-v2")); }catch(e){} if(!oldP||!oldP.length)return false;
  var ranges=[[1,7],[8,14],[15,21],[22,28],[29,31]]; var oldC={}; try{ oldC=JSON.parse(localStorage.getItem("plan-cells-v2"))||{}; }catch(e){}
  state.projects=oldP; state.cells={};
  Object.keys(oldC).forEach(function(k){ var i=k.indexOf("|"); var pid=k.slice(0,i), wk=k.slice(i+1); var m=/^(\d{4})-(\d{1,2})-(\d)$/.exec(wk); var nk;
    if(m){ var d=new Date(+m[1],+m[2],ranges[+m[3]][0]); nk=wkeyOf(d); } else nk=wk;
    var src=oldC[k]; var tasks=src.tasks||(src.text?[{text:src.text}]:[]); var dst=state.cells[cellKey(pid,nk)]||{tasks:[],color:"none"};
    dst.tasks=dst.tasks.concat(tasks); if(src.color&&src.color!=="none")dst.color=src.color; state.cells[cellKey(pid,nk)]=dst; });
  try{ var ct=JSON.parse(localStorage.getItem("plan-cats-v2")); if(ct)state.categories=ct; }catch(e){}
  try{ var m2=JSON.parse(localStorage.getItem("plan-meta-v2")); if(m2&&m2.year)state.year=m2.year; }catch(e){}
  return true; }
(function init(){
  var hasV3=false; try{ var pj=localStorage.getItem(KP); if(pj){ state.projects=JSON.parse(pj)||[]; hasV3=true; } }catch(e){}
  if(hasV3){ try{ var c=localStorage.getItem(KC); if(c) state.cells=JSON.parse(c); }catch(e){}
    try{ var m=localStorage.getItem(KM); if(m){ m=JSON.parse(m); if(m.year)state.year=m.year; if(m.revealed)state.revealed=m.revealed; } }catch(e){}
    try{ var ct=localStorage.getItem(KCAT); if(ct) state.categories=JSON.parse(ct); }catch(e){} }
  else { if(migrateV2()){ normalize(); saveAll(); } }
  try{ var th=localStorage.getItem("plan-theme"); if(th)state.theme=th; }catch(e){}
  var cy=currentWeek().year; if(Math.abs(state.year-cy)>1)state.year=cy;
  normalize(); applyTheme(); render();
  var ids={}; state.projects.forEach(function(p){ (p.doc.comments||[]).forEach(function(c){ (c.images||[]).forEach(function(id){ ids[id]=1; }); }); });
  var keys=Object.keys(ids); if(keys.length){ Promise.all(keys.map(function(id){ return idbGet(id).then(function(v){ if(v)state.images[id]=v; }).catch(function(){}); })).then(function(){ render(); }); }
})();
