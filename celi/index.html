  if(state.sort==="deadline"){
    return list.sort(function(a,b){

}

    pushCloud("meta");

    var m=JSON.stringify(metaObj());
    if(lastSync.meta!==m){ metaDoc().set(JSON.parse(m)); lastSync.meta=m; }
  } else if(kind==="days"){

function fullCloudPush(){ if(!cloudReady)return; lastSync={goals:{},days:{},meta:""}; pushCloud("goals"); pushCloud("days"); Object.keys(state.images).forEach(function(id){ cloudPutImage(id,state.images[id]); }); }
function withTo(p,ms){ return Promise.race([p,new Promise(function(_,rj){ setTimeout(function(){ rj(new Error("timeout")); },ms); })]); }
function neededImageIds(){ var ids={};
  state.goals.forEach(function(g){ if(g.photo)ids[g.photo]=1; (g.notes||[]).forEach(function(n){ notePhotos(n).forEach(function(pid){ ids[pid]=1; }); }); });
  Object.keys(state.dayExtra||{}).forEach(function(k){ ((state.dayExtra[k]||{}).photos||[]).forEach(function(pid){ ids[pid]=1; }); });
  return Object.keys(ids);
}
function hydrateImages(){
  var keys=neededImageIds().filter(function(id){ return !state.images[id]; });
  if(!keys.length) return;
  Promise.all(keys.map(function(id){ return idbGet(id).then(function(v){ if(v)state.images[id]=v; }).catch(function(){}); })).then(function(){
    var missing=keys.filter(function(id){ return !state.images[id]; });
    if(missing.length && cloudReady){
      return Promise.all(missing.map(function(id){ return withTo(colImages().doc(id).get(),15000).then(function(sn){ if(sn.exists){ var d=sn.data().d; if(d){ state.images[id]=d; idbSet(id,d).catch(function(){}); } } }).catch(function(){}); }));
    }
  }).then(function(){ render(); });
}
function loadFromCloud(){
  return withTo(colGoals().get(),20000).then(function(snap){
    if(!snap.empty){
      var arr=snap.docs.map(function(d){ return d.data(); });
      return withTo(metaDoc().get(),15000).then(function(ms){
        var meta=ms.exists?ms.data():{};
        if(meta.goalOrder){ var pos={}; meta.goalOrder.forEach(function(id,i){ pos[id]=i; }); arr.sort(function(a,b){ return (pos[a.id]!=null?pos[a.id]:999)-(pos[b.id]!=null?pos[b.id]:999); }); }
        state.goals=arr;
        if(meta.cats)state.cats=meta.cats; if(meta.sort)state.sort=meta.sort;
        state.onlyActive=!!meta.onlyActive;
        if(meta.theme){ state.theme=meta.theme; } if(meta.listMode)state.listMode=meta.listMode; state.useShort=!!meta.useShort;
        return withTo(colDays().get(),15000).then(function(ds){ var de={}; ds.docs.forEach(function(d){ de[d.id]=d.data(); }); state.dayExtra=de; });
      }).then(function(){
        normalizeGoals(); applyTheme();
        try{ localStorage.setItem(KEY,JSON.stringify(state.goals)); localStorage.setItem(KEY_CATS,JSON.stringify(state.cats)); localStorage.setItem("marina-dayextra-v1",JSON.stringify(state.dayExtra)); localStorage.setItem("marina-theme",state.theme); }catch(e){}
        state.goals.forEach(function(g){ lastSync.goals[g.id]=JSON.stringify(g); });
        Object.keys(state.dayExtra).forEach(function(k){ lastSync.days[k]=JSON.stringify(state.dayExtra[k]); });
        lastSync.meta=JSON.stringify(metaObj());
        return true;
      });
    }
    return false;
  });
}
function LoginView(){
  var app=h("div",{class:"app"});
  var box=h("div",{style:{padding:"70px 26px 40px",display:"flex",flexDirection:"column",alignItems:"center",textAlign:"center"}});
  box.appendChild(h("div",{style:{fontSize:"46px",marginBottom:"10px"}},"🎯"));
  box.appendChild(h("h1",{class:"h1",style:{marginBottom:"6px"}},"Цели"));
  box.appendChild(h("div",{style:{color:"var(--sub)",fontSize:"14.5px",lineHeight:"1.45",marginBottom:"24px"}},"Войди — цели и отчёты будут синхронизироваться между всеми твоими устройствами."));
  var err=h("div",{style:{color:"var(--danger)",fontSize:"13px",minHeight:"18px",marginTop:"12px"}},"");
  function ruErr(e){ var c=(e&&e.code)||"";
    if(c.indexOf("invalid-email")>=0)return "Проверь адрес почты — он написан с ошибкой.";
    if(c.indexOf("user-not-found")>=0)return "Такой аккаунт не найден — попробуй «Регистрация».";
    if(c.indexOf("wrong-password")>=0||c.indexOf("invalid-credential")>=0)return "Неверная почта или пароль.";
    if(c.indexOf("email-already-in-use")>=0)return "Эта почта уже зарегистрирована — нажми «Войти».";
    if(c.indexOf("weak-password")>=0)return "Пароль слишком простой — минимум 6 символов.";
    if(c.indexOf("too-many-requests")>=0)return "Слишком много попыток — подожди немного.";
    if(c.indexOf("network")>=0)return "Нет соединения — проверь интернет.";
    return "Не получилось войти: "+((e&&e.message)||e); }
  box.appendChild(h("button",{class:"saveWide", onClick:function(){
    var prov=new firebase.auth.GoogleAuthProvider();
    firebase.auth().signInWithPopup(prov).catch(function(){ firebase.auth().signInWithRedirect(prov).catch(function(e2){ err.textContent=ruErr(e2); }); });
  }},"Войти через Google"));
  box.appendChild(h("div",{style:{color:"var(--sub)",fontSize:"13px",margin:"16px 0 8px"}},"или по почте"));
  var em=h("input",{class:"inp",type:"email",placeholder:"Почта"}); box.appendChild(em);
  var pw=h("input",{class:"inp",type:"password",placeholder:"Пароль"}); box.appendChild(pw);
  var row=h("div",{style:{display:"flex",gap:"10px",width:"100%",marginTop:"8px"}});
  row.appendChild(h("button",{class:"ghostBtn",style:{flex:"1"}, onClick:function(){ if(!em.value.trim()||!pw.value){ err.textContent="Заполни почту и пароль."; return; } firebase.auth().signInWithEmailAndPassword(em.value.trim(),pw.value).catch(function(e){ err.textContent=ruErr(e); }); }},"Войти"));
  row.appendChild(h("button",{class:"ghostBtn",style:{flex:"1"}, onClick:function(){ if(!em.value.trim()||!pw.value){ err.textContent="Заполни почту и пароль."; return; } firebase.auth().createUserWithEmailAndPassword(em.value.trim(),pw.value).catch(function(e){ err.textContent=ruErr(e); }); }},"Регистрация"));
  box.appendChild(row);
  box.appendChild(h("button",{class:"linkBtn",style:{marginTop:"20px"}, onClick:function(){
    state.confirm={title:"Войти без аккаунта?",text:"Записи будут привязаны только к этому устройству — без синхронизации. При выходе доступ к ним потеряется.",yes:"Продолжить",onYes:function(){ firebase.auth().signInAnonymously().catch(function(e){ err.textContent=ruErr(e); }); }}; render();
  }},"Войти без аккаунта"));
  box.appendChild(err);
  app.appendChild(box);
  if(state.confirm) app.appendChild(ConfirmModal());
  return app;
}

/* ---------- запуск ---------- */
(function init(){
  try{ state.goals = JSON.parse(localStorage.getItem(KEY)) || []; }catch(e){ state.goals = []; }
  try{ var rc=localStorage.getItem(KEY_CATS); if(rc) state.cats=JSON.parse(rc); }catch(e){}
  try{ var rs=localStorage.getItem(KEY_SORT); if(rs) state.sort=rs; }catch(e){}
  try{ var oa=localStorage.getItem("marina-onlyactive-v1"); if(oa==="1") state.onlyActive=true; }catch(e){}
  try{ var th=localStorage.getItem("marina-theme"); if(th)state.theme=th; }catch(e){}
  try{ var de=localStorage.getItem("marina-dayextra-v1"); if(de)state.dayExtra=JSON.parse(de); }catch(e){}
  try{ var lm=localStorage.getItem("marina-listmode"); if(lm)state.listMode=lm; }catch(e){}
  try{ var us=localStorage.getItem("marina-useshort"); if(us==="1")state.useShort=true; }catch(e){}
  normalizeGoals(); applyTheme();
  var realRender=render;
  render=function(){ if(!fbUser){ var root=document.getElementById("root"); root.innerHTML=""; root.appendChild(LoginView()); return; } realRender(); };
  if(typeof firebase==="undefined"){
    var root=document.getElementById("root");
    root.innerHTML='<div style="padding:80px 30px;text-align:center;color:var(--sub);font-size:15px;line-height:1.5">Нет соединения с сервисом входа.<br>Проверь интернет и обнови страницу.</div>';
    return;
  }
  try{ firebase.initializeApp(firebaseConfig); }catch(e){}
  fdb=firebase.firestore();
  var pReady=Promise.resolve();
  try{ pReady=fdb.enablePersistence({synchronizeTabs:true}).catch(function(){}); }catch(e){}
  firebase.auth().onAuthStateChanged(function(user){
    fbUser=user;
    if(!user){ cloudReady=false; render(); return; }
    render();
    pReady.then(function(){
      cloudReady=true;
      return loadFromCloud();
    }).then(function(hadCloud){
      if(hadCloud===false && state.goals.length){ fullCloudPush(); }
      else if(hadCloud===false){ lastSync.meta=""; pushCloud("meta"); }
      render();
      hydrateImages();
    }).catch(function(){ render(); hydrateImages(); });
  });
  if("serviceWorker" in navigator){ try{ navigator.serviceWorker.register("./sw.js"); }catch(e){} }
})();
</script>
</body>
</html>
